<!DOCTYPE html>
<html>
<head><title>Tablescss Step1 | SE371 Web Engineering Resource</title>
<link rel="canonical" href="https://shoug-tech.com/academics/software-engineering/se371/extra-resources/tutorials/css/styling-tables-using-default-class-and-id-specific-styles/tablescss-step1.html">
<meta name="description" content="Explore the Tablescss Step1 example or study file for SE371 Web Engineering, with practical HTML, CSS, JavaScript, Node.js, and database course resources.">
  <style>
    table {
      border: 2px solid black; /* Default border for all tables */
      width: 80%; /* Default width */
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    thead {
      background-color: lightgray; /* Default header background */
    }

    tfoot {
      background-color: darkgray; /* Default footer background */
    }
  </style>
</head>
<body>
  <h2>Step 1: Default Table Style</h2>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>ID</th>
        <th>Mark</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Ali</td>
        <td>101</td>
        <td>85</td>
      </tr>
      <tr>
        <td>Hassan</td>
        <td>102</td>
        <td>90</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td colspan="2">Average</td>
        <td>87.5</td>
      </tr>
    </tfoot>
  </table>
</body>
</html>
