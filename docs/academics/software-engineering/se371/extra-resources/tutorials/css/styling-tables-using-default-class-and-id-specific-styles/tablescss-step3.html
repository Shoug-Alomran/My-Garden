<!DOCTYPE html>
<html>
<head><title>Tablescss Step3 | SE371 Web Engineering Resource</title>
<link rel="canonical" href="https://shoug-tech.com/academics/software-engineering/se371/extra-resources/tutorials/css/styling-tables-using-default-class-and-id-specific-styles/tablescss-step3.html">
<meta name="description" content="Explore the Tablescss Step3 example or study file for SE371 Web Engineering, with practical HTML, CSS, JavaScript, Node.js, and database course resources.">
  <style>
    table {
      border: 2px solid black; 
      width: 80%; 
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    thead {
      background-color: lightgray; 
    }

    tfoot {
      background-color: darkgray; 
    }

    .colorful-table thead {
      background-color: orange;
    }

    .colorful-table tfoot {
      background-color: lightblue;
    }

    /* ID-based style */
    #special-table thead {
      background-color: green;
    }

    #special-table tfoot {
      background-color: yellow;
    }
  </style>
</head>
<body>
  <h2>Step 3: ID-Based Table Style</h2>
  
  <!-- Default Table -->
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>ID</th>
        <th>Mark</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Ali</td>
        <td>101</td>
        <td>85</td>
      </tr>
      <tr>
        <td>Hassan</td>
        <td>102</td>
        <td>90</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td colspan="2">Average</td>
        <td>87.5</td>
      </tr>
    </tfoot>
  </table>

  <!-- Colorful Table -->
  <table class="colorful-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>ID</th>
        <th>Mark</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Omar</td>
        <td>103</td>
        <td>88</td>
      </tr>
      <tr>
        <td>Khalid</td>
        <td>104</td>
        <td>92</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td colspan="2">Average</td>
        <td>90</td>
      </tr>
    </tfoot>
  </table>

  <!-- Special Table -->
  <table id="special-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>ID</th>
        <th>Mark</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Faisal</td>
        <td>105</td>
        <td>95</td>
      </tr>
      <tr>
        <td>Ibrahim</td>
        <td>106</td>
        <td>98</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td colspan="2">Average</td>
        <td>96.5</td>
      </tr>
    </tfoot>
  </table>
</body>
</html>
