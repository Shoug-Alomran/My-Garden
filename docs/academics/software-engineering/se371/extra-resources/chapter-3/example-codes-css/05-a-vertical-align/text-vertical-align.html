<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    
    .inline-text-top {
      font-size: 10px;
      vertical-align:  top ;  /* Aligns text in the middle */
    }
    .inline-text-bot {
      font-size: 10px;
      vertical-align: bottom;  /* Aligns text in the middle */
    }
  </style>
  <title>Text Vertical Align | SE371 Web Engineering Resource</title>
<link rel="canonical" href="https://shoug-tech.com/academics/software-engineering/se371/extra-resources/chapter-3/example-codes-css/05-a-vertical-align/text-vertical-align.html">
<meta name="description" content="Explore the Text Vertical Align example or study file for SE371 Web Engineering, with practical HTML, CSS, JavaScript, Node.js, and database course resources.">
</head>
<body>
  <div>
    <span class="inline-text-top">Text above the image</span>
    <img src="pdf.jpg" class="image" alt="Image">
    <span class="inline-text-bot">Text below the image</span>
  </div>
</body>
</html>
