<style> 
#container {
  width: 70%;
  gap:50px;
  border: 1px solid black;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  /* justify-items: center; */
}

#container > div {
  border: 1px solid black;
}

.blue {
  background-color: lightblue;
  width: 100px;
  height: 120px;
  justify-self: start;
  align-self: end;

}

.red {
  background-color: coral;
  width: 120px;
  height: 130px;
  justify-self: end;
  align-self: center;

}

.green {
  background-color: lightgreen;
  width: 150px;
  height: 140px;

}
</style>
