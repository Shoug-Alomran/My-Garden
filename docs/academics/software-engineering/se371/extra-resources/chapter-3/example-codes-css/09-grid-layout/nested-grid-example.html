<!DOCTYPE html>
<html>
<head><title>Nested Grid Example | SE371 Web Engineering Resource</title>
<link rel="canonical" href="https://shoug-tech.com/academics/software-engineering/se371/extra-resources/chapter-3/example-codes-css/09-grid-layout/nested-grid-example.html">
<meta name="description" content="Explore the Nested Grid Example example or study file for SE371 Web Engineering, with practical HTML, CSS, JavaScript, Node.js, and database course resources.">
<style> 

.container {
    display: grid;
    grid-gap: 10px;
    grid-template-columns: repeat(2, 150px ) ;
    grid-template-rows: repeat(2, auto  ); /* auto : size determined by actual content */
    background-color: #fff;
    color: #444;
  }

  .box {
    background-color: #444;
    color: #fff;
    border-radius: 5px;
    padding: 20px;
    font-size: 150%;

  }
 
  .c {
    grid-row: 2;
    grid-column:1;
  }

  .d{
    grid-row: 2;
    grid-column:2;
    display: grid;
    grid-gap: 10px;
    grid-template-columns: 1fr 1fr  ;
  }

  .box1 {
    background-color: #ccc;
    color: #444;
  }
  .e {
    grid-column: 1 / 3;
  }

  .f {
    grid-column: 1;
    grid-row: 2;
  }

  .g {
    grid-column: 2;
    grid-row: 2;
  }
</style>
</head>
<body>

<div class="container">
    <div class="box a">A</div>
    <div class="box b">B</div>
    <div class="box c">C</div>
    <div class="box d">
      <div class="box1 e">E</div>
      <div class="box1 f">F</div>
      <div class="box1 g">G</div>
    </div>
  </div>

</body>
</html>
