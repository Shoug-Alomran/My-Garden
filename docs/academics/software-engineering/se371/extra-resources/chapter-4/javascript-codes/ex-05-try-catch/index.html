<body>

<h2>JavaScript try catch</h2>

<p>Please input a number between 5 and 10:</p>

<input id="demo" type="text">
<button type="button" onclick="myFunction()">Test Input</button>
<p id="p01"></p>

<script>
function myFunction() {
  message = document.getElementById("p01");
  message.innerHTML = "";
  let x = document.getElementById("demo").value;
  try { 
    if (x.trim() === "") throw new Error("empty", { cause: "User has not provided data" });  //trim() removes whitespace from both sides of a string:
    if(isNaN(x)) throw new Error("not a number"); //isNaN() return boolean after testing value NaN or not. 
    x = Number(x);
    if(x < 5)  throw new Error("too low");
    if(x > 10)   throw new Error("too high");
  }
  catch(err) { 
    message.innerHTML = "Input is " + err;
    
  }
}

</script>

</body>
</html>
