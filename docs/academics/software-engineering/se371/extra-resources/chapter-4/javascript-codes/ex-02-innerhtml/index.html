<body>
<div id="mylinks">
This is my <b>link collection</b>:
<ul>
<li><a href="www.borland.com">Bye bye <b>Borland</b> </a></li>
<li><a href="www.microfocus.com">Welcome to <b>Micro Focus</b></a></li>

</div>
<script>
let html = document.getElementById("mylinks").innerHTML;
let in_text = document.getElementById("mylinks").innerText;
let text_cont = document.getElementById("mylinks").textContent;
console.log(html);
console.log(in_text);
console.log(text_cont);

document.getElementById("mylinks").innerHTML+="<p> This paragraph is <strong>added from JS </strong> </p>"
document.write("This paragraph is added from JS using document.write()")
</script>
