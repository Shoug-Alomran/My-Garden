<body>
<h1 class="shoug-visually-hidden">04B Button | SE371 Web Engineering Resource</h1>

<form action="action-page.html" method="get">

    <fieldset>
        <legend>Some Form</legend>

        <label>
            Text input:
            <input type="text" placeholder="Enter some text here.">
        </label>
        <br><br>

        <label>
            Phone number 1:
            <input type="text">
        </label>
    </fieldset>

    <fieldset>
        <legend>Buttons that submit the HTTP request</legend>

        <!-- Input submit -->
        <input type="submit" value="Input Type Submit">
        <input type="image" src="plane.png">

        <!-- Button submit with image and text -->
        <button type="submit">
            <img src="plane.png" alt="icon">
            Button With Image and Text
        </button>

        <!-- Button -->
        <button>Simple Button</button>

        <!-- Another submit -->
        <button type="submit">Simple Button Type Submit</button>
    </fieldset>

    <fieldset>
        <legend>Buttons that do not submit the HTTP request</legend>

        <!-- Button type button -->
        <button type="button">Simple Button Type Button</button>

        <!-- Input type button -->
        <input type="button" value="Input Type Button">

        <!-- Disabled button -->
        <button type="button" disabled>Simple Disabled Button</button>

        <!-- Reset button -->
        <input type="reset" value="Reset">
    </fieldset>

</form>

</body>
