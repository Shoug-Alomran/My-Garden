<h1>The select element</h1>

<p>The select element is used to create a drop-down list.</p>

<form action="action-page.html">
  <label for="cars">Choose a car:</label>
  <select name="cars" id="cars">
    <option value="volvo">Volvo</option>
    <option value="saab" selected>Saab</option>
    <option value="opel" >Opel</option>
    <option value="audi">Audi</option>
  </select>
  <br><br>
  
  <label for="multipl_cars">Choose a car:</label>
  <select name="mult_cars_var" id="multipl_cars" multiple>
    <option >Volvo</option>
    <option >Saab</option>
    <option >Opel</option>
    <option >Audi</option>
  </select>
  <br><br>

  <label for="cars_optg">Choose a car:</label>
  <select name="cars_optg_var" id="cars_optg" multiple>
    <optgroup label="Swedish Cars">
      <option value="volvo">Volvo</option>
      <option value="saab">Saab</option>
    </optgroup>
    <optgroup label="German Cars">
      <option value="mercedes">Mercedes</option>
      <option value="audi">Audi</option>
    </optgroup>
  </select>
  <br><br>

  <input type="submit" value="Submit">
</form>


</body>
