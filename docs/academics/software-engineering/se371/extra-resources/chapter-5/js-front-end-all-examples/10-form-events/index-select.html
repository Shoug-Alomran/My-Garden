<!DOCTYPE html>
<html><head><title>Index Select | SE371 Web Engineering Resource</title><meta name="description" content="Explore the Index Select example or study file for SE371 Web Engineering, with practical HTML, CSS, JavaScript, Node.js, and database course resources."><link rel="canonical" href="https://shoug-tech.com/academics/software-engineering/se371/extra-resources/chapter-5/js-front-end-all-examples/10-form-events/index-select.html"></head>
  <body>
    <input value="Try selecting some text in this element." />
    <p id="log"></p>
    
    <script>
      function logSelection(event) {
        const log = document.getElementById("log");
        const selection = event.target.value.substring(event.target.selectionStart,
        event.target.selectionEnd,    
    );
    log.textContent = `You selected: ${selection}`;
     }
      const input = document.querySelector("input");
      input.addEventListener("select", logSelection);
    </script>
  </body>
    
</html>
