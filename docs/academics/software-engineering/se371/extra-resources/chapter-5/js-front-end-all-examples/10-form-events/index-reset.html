  <body>
<h1 class="shoug-visually-hidden">Index Reset | SE371 Web Engineering Resource</h1>
    <p>When you reset the form, a function is triggered which alerts some text.</p>
    <form id="form" method="get" action="#">
        <label>Test field: <input type="text" /></label>
        <br /><br />
        <button type="reset">Reset form</button>
    </form>
    <p id="log"></p>
    
    <script>
    function logReset(event) {
        log.textContent = `Form reset! Timestamp: ${event.timeStamp}`;
    }
    const form = document.getElementById("form");
    const log = document.getElementById("log");
    form.addEventListener("reset", logReset);
    </script>
  </body>
