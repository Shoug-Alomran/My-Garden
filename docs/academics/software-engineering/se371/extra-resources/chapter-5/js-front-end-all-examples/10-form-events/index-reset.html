<!DOCTYPE html>
<html><head><title>Index Reset | SE371 Web Engineering Resource</title><meta name="description" content="Explore the Index Reset example or study file for SE371 Web Engineering, with practical HTML, CSS, JavaScript, Node.js, and database course resources."><link rel="canonical" href="https://shoug-tech.com/academics/software-engineering/se371/extra-resources/chapter-5/js-front-end-all-examples/10-form-events/index-reset.html"></head>
  <body>
    <p>When you reset the form, a function is triggered which alerts some text.</p>
    <form id="form" method="get" action="#">
        <label>Test field: <input type="text" /></label>
        <br /><br />
        <button type="reset">Reset form</button>
    </form>
    <p id="log"></p>
    
    <script>
    function logReset(event) {
        log.textContent = `Form reset! Timestamp: ${event.timeStamp}`;
    }
    const form = document.getElementById("form");
    const log = document.getElementById("log");
    form.addEventListener("reset", logReset);
    </script>
  </body>
    
</html>
