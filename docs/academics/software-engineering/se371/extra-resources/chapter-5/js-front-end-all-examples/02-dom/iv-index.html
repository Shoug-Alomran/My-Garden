<body>
<h1 class="shoug-visually-hidden">Iv Index | SE371 Web Engineering Resource</h1>
  <p id="here">hello <span>there</span></p>
  <ul>
    <li>France</li>
    <li>Spain</li>
    <li>Thailand</li>
  </ul>
  
  <div id="main">
    <a href="https://tenor.com/view/whatever-sassy-ugh-duh-eyeroll-gif-17849793169258709107">
      <img src="whatever.gif" class="thumb">
    </a>
  </div>

  <script>

    const node = document.getElementById("here");
    
    console.log(node.innerHTML); // hello <span>there</span>
    console.log(node.textContent); //“hello there”

    const items = document.getElementsByTagName("li");
    for (let i = 0; i < items.length; i++) {
      // outputs: France Spain  Thailand
      console.log(items[i].textContent);
    }

    const link = document.querySelector("#main a");

    console.log(link.href); 

    const img = document.querySelector("#main img");
    console.log(img.src); 

    console.log(img.className); // outputs: thumb
    

  </script>
