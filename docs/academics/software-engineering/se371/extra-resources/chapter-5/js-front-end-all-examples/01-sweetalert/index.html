    <h1>Sweet alert example.</h1>

    <button onclick="fireAlert();">Fire</button>


    <script >
      function fireAlert () {
        Swal.fire({
          title: "Something went wrong...",
          text: "Your data could not be saved!",
          icon: "error",
          footer: '<a href="/issues">Why do I have this issue?</a>'
          
        });
      }

    </script>
