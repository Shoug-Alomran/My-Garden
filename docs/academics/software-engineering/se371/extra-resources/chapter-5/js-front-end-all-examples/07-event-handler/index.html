<!DOCTYPE html>
<html lang="en">
<head>
  <!-- general meta tags -->

<link rel="canonical" href="https://shoug-tech.com/academics/software-engineering/se371/extra-resources/chapter-5/js-front-end-all-examples/07-event-handler/">
<meta name="description" content="Explore the 07 Event Handler example or study file for SE371 Web Engineering, with practical HTML, CSS, JavaScript, Node.js, and database course resources.">
  <script>

    function appendTextElementTo(element, text){
      const p = document.createElement("p");
      p.textContent = text;
      element.appendChild(p);
    }
    
    const date = new Date();
    window.addEventListener("load", () => {
      const msgs = document.getElementById("messages");
      appendTextElementTo(msgs, "Window Load event fired: " + date);
    })
  
    document.addEventListener("DOMContentLoaded", () => {
      const msgs = document.getElementById("messages");
      appendTextElementTo(msgs, "Document DOMContentLoaded event fired: " + date);
    })
  
  </script>
</head>
<body>
  <div id="messages"></div>

</body>
</html>
