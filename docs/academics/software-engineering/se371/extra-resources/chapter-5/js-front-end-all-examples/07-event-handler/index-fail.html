  <script>
    // This script will fail as the html element with id "messages" doesn't exist yet.
    //  Place this script at the end of the body and try to execute it.
    function appendTextElementTo(element, text){
      const p = document.createElement("p");
      p.textContent = text;
      element.appendChild(p);
    }

    const msgs = document.getElementById("messages");
    const date = new Date();
    window.addEventListener("load", () => {
      appendTextElementTo(msgs, "Window Load event fired: " + date);
    })
  
    document.addEventListener("DOMContentLoaded", () => {
      appendTextElementTo(msgs, "Document DOMContentLoaded event fired: " + date);
    })
  
  </script>
