name: Sync PSU academic calendar

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Fetch PSU academic calendar
        run: node scripts/sync-psu-academic-calendar.js

      - name: Commit updated calendar data
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "Update PSU academic calendar"
          file_pattern: docs/javascripts/psu-academic-calendar.js
