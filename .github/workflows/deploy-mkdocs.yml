name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # Safety net for files committed without the local pre-commit hook (e.g.
      # uploaded through github.com): embed any new activity/lab/tutorial files
      # into the deployed site. Pages generated here are not committed back.
      - name: Embed new resource files
        run: python3 scripts/embed_resources.py

      # Repair slide-breakdown viewers from the files that actually exist.
      # This prevents legacy path assumptions or stale generated shells from
      # showing COMING SOON when a sibling breakdown HTML file is present.
      - name: Repair slide breakdown viewers
        run: python3 scripts/repair_slide_breakdown_viewers.py

      - name: Validate slide breakdown viewers
        run: python3 scripts/validate_slide_breakdown_viewers.py

      # Safety net: keep the cybersecurity track red (no purple) for pages that
      # were generated or uploaded without running a course builder.
      - name: Apply cybersecurity red theme
        run: python3 scripts/apply_cyber_red_theme.py

      - name: Validate static site
        run: |
          python3 scripts/install_breakdown_language.py
          node scripts/build-course-manifest.js
          node scripts/build-search-index.js
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python3 scripts/build_ai_slide_contexts.py
          python3 scripts/optimize_site_html.py
          python3 scripts/verify_site_routes.py
          python3 scripts/check_site_links.py
          python3 scripts/check_seo_metadata.py
          python3 scripts/check_sitemap.py
          python3 scripts/build_indexing_manifest.py

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Test indexing edge rules
        run: node --test workers/indexing/src/index.test.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Notify IndexNow of changed URLs
        run: >-
          python3 scripts/submit_indexnow.py
          --before "${{ github.event.before }}"
          --after "${{ github.sha }}"
