name: Deploy static site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Validate static site
        run: |
          node scripts/build-course-manifest.js
          node scripts/build-search-index.js
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python3 scripts/build_ai_slide_contexts.py
          python3 scripts/optimize_site_html.py
          python3 scripts/verify_site_routes.py
          python3 scripts/check_site_links.py
          python3 scripts/check_seo_metadata.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Notify IndexNow of changed URLs
        run: >-
          python3 scripts/submit_indexnow.py
          --before "${{ github.event.before }}"
          --after "${{ github.sha }}"
